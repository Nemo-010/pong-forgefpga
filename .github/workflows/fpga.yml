name: fpga

# Builds the real ForgeFPGA bitstream.
#
# Renesas publishes the Go Configure Software Hub as an ordinary Debian
# package with no account, so this can run on a stock runner:
#
#   https://renesasweb-greenpak.s3.us-west-2.amazonaws.com/v6.55/
#       go-configure-sw-hub-v6.55.001-debian-13-amd64.deb
#
# It is 291 MB (about 1.2 GB extracted) and the place-and-route step is
# single-threaded-ish, so this is a manual/tag build rather than something
# on every push.
#
# NOT YET RUN ON GITHUB'S RUNNERS.  Every command below is the same command
# as the local build documented in fpga/README.md, run in the same order,
# but the workflow itself has only been exercised locally in an
# unprivileged container, not on a GitHub runner.  Treat the first run as
# the test.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bitstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 make curl ca-certificates binutils

      - name: fetch the Renesas toolchain
        run: |
          curl -fSL -o /tmp/gcsh.deb \
            https://renesasweb-greenpak.s3.us-west-2.amazonaws.com/v6.55/go-configure-sw-hub-v6.55.001-debian-13-amd64.deb
          mkdir -p /opt/gcsh
          dpkg-deb -x /tmp/gcsh.deb /opt/gcsh

      - name: build the bitstream
        run: |
          make -C fpga all \
            GCSW=/opt/gcsh/usr/local/go-configure-sw-hub/bin/external \
            TMPDIR=$RUNNER_TEMP

      - name: report resources and timing
        run: |
          echo "--- resource usage"
          grep -E "Usage of|Placement success" fpga/ffpga/build/PNR_STDOUT.log || true
          echo "--- achievable frequency"
          grep -A2 "Achievable Frequency" fpga/ffpga/build/PNR_TIMING.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: pong-forgefpga-bitstream
          path: fpga/ffpga/build/bitstream/*.bin
          if-no-files-found: error
